{% extends 'students/base.html'%}
{% load static %}
{% block styleblock %}
<link rel="stylesheet" href="{% static 'css/Addsubject.css'%}">
{% endblock styleblock %}

{% block main-section %}
<div class="hero">
    <div class="add-title">
        <h1>Add Subject</h1>
    </div>
    
    <form action="" method="POST">
        {% csrf_token %}
        <div class="form-control">
            <label for="sub">Subject Title</label>
            <input type="text" name="subject" id="sub" class="inputfield" placeholder="Enter Subject">
            <label for="marks">Select Class</label>
            <select name="class" id="class" class="inputfield">
                <option value="Nursery">Nursery</option>
                <option value="Prep">Prep</option>
                <option value="One">One</option>
                <option value="Two">Two</option>
                <option value="Three">Three</option>
                <option value="Four">Four</option>
                <option value="Five">Five</option>
                <option value="Six">Six</option>
                <option value="Seven">Seven</option>
                <option value="Eight">Eight</option>
                <option value="9th">9th</option>
                <option value="10th">10th</option>
                <option value="FirstYear">FirstYear</option>
                <option value="SeconYear">SecondYear</option>
            </select>
            <label for="marks">Subject Marks</label>
            <input type="number" name="marks" id="marks" class="inputfield" placeholder="Subject Marks">
            <label for="teacher">Select Teacher</label>
            <select name="teacher" id="teacher" class="inputfield" >
                {% for teacher in teachers  %}
                <option value="{{teacher.Cnic}}">{{teacher.Full_Name}}</option>
                {% endfor %}
            </select>
            <input type="submit" value="Submit" class="sub-btn">
        </div>
    </form>
</div>
{% endblock main-section %}
